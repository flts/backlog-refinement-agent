[project]
name = "agent-service"
version = "0.1.0"
description = "Agent service: AG-UI endpoint on Microsoft Agent Framework, private threads, feedback"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "agent-framework-core==1.26.0",
  "agent-framework-openai>=1.18.2,<1.19",
  "agent-framework-ag-ui==1.8.1",
  "mcp>=2.2,<3",
  "tenacity>=9.1.4,<10",
  "pyyaml>=6.0",
  "backlog-contracts",
  "backlog-skills",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.9",
  "asgi-lifespan>=2.1",
]

[tool.uv.sources]
backlog-contracts = { workspace = true }
backlog-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["ignore:testcontainers.postgres is deprecated:DeprecationWarning"]
