[project]
name = "backlog-api"
version = "0.1.0"
description = "Backlog domain service: projects, members, items, sources and the backlog MCP server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "httpx>=0.28",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.18",
  "pypdf>=5.1",
  "backlog-skills",
  "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.9",
  "asgi-lifespan>=2.1",
]

[tool.uv.sources]
backlog-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_api"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["ignore:testcontainers.postgres is deprecated:DeprecationWarning"]
markers = ["slow: takes more than ~5 seconds (run only these with `-m slow`, skip them with `-m \"not slow\"`)"]
