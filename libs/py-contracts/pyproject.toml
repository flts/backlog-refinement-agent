[project]
name = "backlog-contracts"
version = "0.1.0"
description = "Pydantic models and JSON Schema loader for the contracts shared by the SPA, agent-service and backlog-api"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
