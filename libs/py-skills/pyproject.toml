[project]
name = "backlog-skills"
version = "0.1.0"
description = "Parses and validates the Agent Skills in /skills and exposes default backlog guidance"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_skills"]
