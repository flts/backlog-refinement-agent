# One service account per workload: Istio derives the mTLS identity (SPIFFE principal) from it, and the
# AuthorizationPolicies in ../istio rely on cluster.local/ns/backlog/sa/agent-service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backlog-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-service
automountServiceAccountToken: false
