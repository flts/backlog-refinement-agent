apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app.kubernetes.io/name: web, app.kubernetes.io/component: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web, app.kubernetes.io/component: frontend}
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: web}
      containers:
        - name: web
          image: backlog-web
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          # Runtime configuration for /config.json (and the CSP). Never secret. The /api/* upstreams are only used
          # when the browser reaches this pod directly; behind the Istio gateway /api is routed by the VirtualService.
          envFrom:
            - configMapRef: {name: web-config}
          readinessProbe:
            httpGet: {path: /config.json, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /config.json, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Caddy writes its autosave config and storage locks here (it listens on plain HTTP only).
            - {name: caddy-config, mountPath: /config}
            - {name: caddy-data, mountPath: /data}
      volumes:
        - {name: caddy-config, emptyDir: {sizeLimit: 16Mi}}
        - {name: caddy-data, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {app.kubernetes.io/name: web}
spec:
  selector: {app.kubernetes.io/name: web}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: web}
