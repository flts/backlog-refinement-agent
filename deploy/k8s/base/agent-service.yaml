apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  labels: {app.kubernetes.io/name: agent-service, app.kubernetes.io/component: backend}
spec:
  # KEEP AT 1 unless sticky routing is active. The Microsoft Agent Framework keeps pending tool approvals
  # (human-in-the-loop interrupts) in process memory: the request that resumes a run must reach the same pod
  # that started it. To scale out, enable the consistent-hash DestinationRule in ../istio/destination-rules.yaml
  # (hash on the thread id) and make sure clients send that header; a pod restart still drops open approvals.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-service, app.kubernetes.io/component: backend}
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: agent-service
      automountServiceAccountToken: false
      # Longer than the 180 s run timeout so in-flight runs can finish during a rollout.
      terminationGracePeriodSeconds: 200
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent-service
          image: agent-service
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8002}
          envFrom:
            - configMapRef: {name: agent-service-config}
            - secretRef: {name: agent-service-secrets}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  labels: {app.kubernetes.io/name: agent-service}
spec:
  selector: {app.kubernetes.io/name: agent-service}
  ports:
    - {name: http, port: 8002, targetPort: http}
---
# Single replica: a budget of minAvailable 1 would block node drains forever, so one voluntary disruption is allowed.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent-service}
